<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accedi alla palestra | CogniLab</title><link rel="stylesheet" href="shared/cognilab.css"><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f2f7f9;font-family:system-ui;color:#19384a}.login{width:min(440px,calc(100% - 32px));margin:24px;padding:30px;background:white;border:1px solid #dce7ed;border-radius:24px;box-shadow:0 12px 35px #19384a10}h1{font-size:1.9rem;margin:20px 0 12px}p{line-height:1.6;color:#567080}label{display:block;margin:18px 0;font-weight:600}input{box-sizing:border-box;display:block;width:100%;padding:14px;margin-top:8px;border:1px solid #c4d5df;border-radius:12px;font:inherit}button{cursor:pointer}form button{width:100%}a{color:#147e80}#status{min-height:26px}</style><link rel="stylesheet" href="shared/responsive.css?v=devices1"></head><body><main class="login"><a href="index.html">← CogniLab</a><h1>Accedi alla palestra</h1><p id="access-copy">La palestra è in fase di test. Usa email e password dell’account autorizzato dal gestore.</p><form id="invitation-login" onsubmit="return false"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn" type="submit">Entra nella palestra</button></form><p id="status" role="status" aria-live="polite"></p><button id="reset" type="button">Password dimenticata</button><p><a href="area-clinica.html">Accesso professionisti</a></p></main><script type="module" src="shared/invitation-login.js?v=access8"></script></body></html>
